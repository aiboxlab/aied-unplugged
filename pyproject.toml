[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aied-unplugged"
version = "0.1.0"
description = "Loaders, graders and baselines for the AIED-Unplugged preview competition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["handwriting", "education", "competition", "automated-essay-scoring", "ocr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pillow>=10",
]

[project.optional-dependencies]
hf = ["datasets>=2.20"]
kaggle = ["kagglehub>=0.3"]
explore = ["matplotlib>=3.7"]
models = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
all = ["aied-unplugged[hf,kaggle,explore,models]"]

[project.urls]
Homepage = "https://tools-competition.org/winner/aied/"
Dataset = "https://huggingface.co/datasets/aiboxlab/aied-unplugged-preview"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/aied_unplugged"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
